name: CI — Repositório da Governança

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sintaxe-e-validacao:
    name: Verificação, Testes Unitários e Validação Copier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Verificar sintaxe dos scripts Node
        run: |
          node --check template/scripts/verificar-governanca.mjs
          node --check template/scripts/validar-commit-msg.mjs
          node --check template/scripts/hook-agente.mjs

      - name: Executar bateria de testes unitários da Governança
        run: |
          npm test

      - name: Testar geração do template Copier
        run: |
          uvx copier copy --defaults . /tmp/teste-governanca
          ls -la /tmp/teste-governanca
          test -f /tmp/teste-governanca/AGENTS.md
          test -f /tmp/teste-governanca/constitution.md
          test -f /tmp/teste-governanca/lefthook.yml
          test -f /tmp/teste-governanca/CHANGELOG.md
          test -f /tmp/teste-governanca/openspec/config.yaml
          test -f /tmp/teste-governanca/.agents/hooks.json
          test -f /tmp/teste-governanca/.mcp.json
          test -d /tmp/teste-governanca/openspec
          test -f /tmp/teste-governanca/openspec/roadmap.md
          test -f /tmp/teste-governanca/docs/catalogo-reuso.md
          test -f /tmp/teste-governanca/.github/pull_request_template.md
          test -d /tmp/teste-governanca/.agents/rules
          test -d /tmp/teste-governanca/docs/adr
          test -d /tmp/teste-governanca/.agents/skills
