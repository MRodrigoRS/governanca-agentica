name: CI — Repositório da Governança

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sintaxe-e-validacao:
    name: Verificação, Testes Unitários e Validação Copier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Verificar sintaxe dos scripts Node
        run: |
          node --check template/scripts/verificar-governanca.mjs
          node --check template/scripts/validar-commit-msg.mjs
          node --check template/scripts/hook-agente.mjs
          node --check template/scripts/lib/classificar-arquivos.mjs
          node --check template/scripts/lib/classificar-cerimonia.mjs

      - name: Executar bateria de testes unitários da Governança
        run: |
          npm test

      - name: Auditoria determinística da Governança (Dogfooding)
        run: |
          node template/scripts/verificar-governanca.mjs --ci

      - name: Testar geração do template Copier
        run: |
          uvx copier copy --defaults --vcs-ref=HEAD . /tmp/teste-governanca
          ls -la /tmp/teste-governanca
          test -f /tmp/teste-governanca/AGENTS.md
          test -f /tmp/teste-governanca/constitution.md
          test -f /tmp/teste-governanca/lefthook.yml
          test -f /tmp/teste-governanca/CHANGELOG.md
          test -f /tmp/teste-governanca/openspec/config.yaml
          test -f /tmp/teste-governanca/.agents/hooks.json
          test -f /tmp/teste-governanca/.mcp.json
          test -d /tmp/teste-governanca/openspec
          test -f /tmp/teste-governanca/openspec/roadmap.md
          test -f /tmp/teste-governanca/docs/catalogo-reuso.md
          test -f /tmp/teste-governanca/docs/runbook.md
          test -f /tmp/teste-governanca/.github/pull_request_template.md
          test -d /tmp/teste-governanca/.agents/rules
          test ! -e /tmp/teste-governanca/.agents/rules/jogos-engines.md
          test ! -e /tmp/teste-governanca/.agents/rules/linear-mcp.md
          test -d /tmp/teste-governanca/docs/adr
          test -d /tmp/teste-governanca/.agents/skills
          test -f /tmp/teste-governanca/.agents/skills/auditoria-seguranca/SKILL.md
          test -f /tmp/teste-governanca/.agents/skills/auditoria-ux-analytics/SKILL.md
          test -f /tmp/teste-governanca/.agents/skills/mesa-de-descoberta/SKILL.md
          test -f /tmp/teste-governanca/.agents/skills/sintetizar-conhecimento/SKILL.md
          test -f /tmp/teste-governanca/docs/conhecimento/INDICE.md
          test -d /tmp/teste-governanca/docs/conhecimento/materiais
          git -C /tmp/teste-governanca init
          git -C /tmp/teste-governanca config user.email "ci@exemplo.com"
          git -C /tmp/teste-governanca config user.name "CI"
          git -C /tmp/teste-governanca add .
          (cd /tmp/teste-governanca && node scripts/verificar-governanca.mjs --staged)
