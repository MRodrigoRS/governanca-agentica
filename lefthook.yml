# Lefthook Configuration — Repositório da Governança
pre-commit:
  commands:
    syntax-check:
      run: node --check template/scripts/verificar-governanca.mjs && node --check template/scripts/validar-commit-msg.mjs && node --check template/scripts/hook-agente.mjs
    unit-tests:
      run: npm test

commit-msg:
  commands:
    validar-commit-msg:
      run: node template/scripts/validar-commit-msg.mjs {1}

pre-push:
  commands:
    suite-completa:
      run: npm test
