# ==============================================================================
# Governança — Template Oficial Copier
# Distribuição: uvx copier copy gh:MRodrigoRS/governan-a-de-agentes-v2 .
# Atualização:  uvx copier update
# ==============================================================================

_subdirectory: template
_templates_suffix: .jinja

_skip_if_exists:
  - CHANGELOG.md
  - README.md
  - package.json
  - "openspec/config.yaml"
  - "openspec/project.md"
  - "openspec/radar-oportunidades.md"
  - "openspec/roadmap.md"
  - "openspec/roadmap/fatia-*.md"
  - "openspec/specs/**"
  - "openspec/changes/**"
  - "docs/adr/**"
  - ".claude/settings.local.json"
  - "docs/particularidades.md"
  - "docs/aprendizados.md"

# ------------------------------------------------------------------------------
# Questionário de Inicialização
# ------------------------------------------------------------------------------
nome_do_projeto:
  type: str
  help: "Nome do projeto (kebab-case recomendado)"
  default: "meu-projeto"

descricao_do_projeto:
  type: str
  help: "Descrição concisa do objetivo do projeto"
  default: "Projeto desenvolvido sob o protocolo da Governança Agêntica."

autor_nome:
  type: str
  help: "Nome do autor ou equipe responsável"
  default: "Equipe de Desenvolvimento"

autor_email:
  type: str
  help: "E-mail de contato do autor ou equipe"
  default: "dev@exemplo.com"

integrar_linear:
  type: bool
  help: "Pré-configurar integração oficial com Linear MCP (gestão de tarefas e diário da equipe)?"
  default: false

linear_workspace_slug:
  type: str
  help: "Slug ou domínio da organização no Linear (ex: rr-diario-agents ou https://linear.app/rr-diario-agents)"
  default: ""
  when: "{{ integrar_linear }}"

linear_team_key:
  type: str
  help: "Chave ou nome da equipe proprietária no Linear (ex: RR ou RR_DIARIO_AGENTS)"
  default: ""
  when: "{{ integrar_linear }}"

linear_project:
  type: str
  help: "Identificador ou URL do Projeto no Linear (ex: P-RR-2 copiado via 'Copiar documento de identidade' ou URL)"
  default: ""
  when: "{{ integrar_linear }}"


