# ==============================================================================
# Lefthook Configuration — Governança
# Orquestrador determinístico de Git Hooks locais (D15)
# Instalação: npx lefthook install
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    gitleaks:
      tags: security secrets
      run: gitleaks protect --staged --verbose --redact
      fail_text: "Gitleaks detectou possíveis segredos ou credenciais no código staged!"
      # Pula se o binário gitleaks não estiver instalado localmente (o CI no GitHub Actions garantirá)
      skip:
        - run: node scripts/lib/lefthook-runner.mjs skip-gitleaks

    openspec-validate:
      tags: specs sdd
      run: npx --yes @fission-ai/openspec validate --all --no-interactive
      fail_text: "Falha na validação estrutural do OpenSpec em openspec/!"
      skip:
        - run: node scripts/lib/lefthook-runner.mjs skip-openspec

    verificar-governanca:
      tags: governanca audit
      run: node scripts/verificar-governanca.mjs
      fail_text: "A verificação determinística da Governança foi violada!"

    typecheck:
      tags: quality types
      run: npm run --if-present typecheck
      fail_text: "Falha na checagem estrita de tipos do TypeScript!"
      skip:
        - run: node scripts/lib/lefthook-runner.mjs skip-typecheck

    unit-tests:
      tags: tests unit
      # Executa testes unitários rápidos poliglotas (Node, Python pytest e Rust cargo test)
      run: node scripts/lib/lefthook-runner.mjs unit-tests
      fail_text: "Falha na execução dos testes unitários rápidos no pre-commit!"
      skip:
        - run: node scripts/lib/lefthook-runner.mjs skip-unit-tests

commit-msg:
  commands:
    validar-commit-msg:
      tags: conventional-commits pt-br
      run: node scripts/validar-commit-msg.mjs {1}
      fail_text: "A mensagem de commit não respeita o padrão Conventional Commits em PT-BR!"

pre-push:
  parallel: false
  commands:
    suite-testes-poliglota:
      tags: tests ci
      # Executa suíte poliglota completa (Node, Python, Rust, .NET e Godot 4 GUT com fallback seguro)
      run: node scripts/lib/lefthook-runner.mjs pre-push
      fail_text: "Falha na suíte poliglota de testes antes do push!"
